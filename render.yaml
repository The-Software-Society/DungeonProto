services:
  - type: web
    name: aldenfall-test-server
    runtime: docker
    rootDir: Deploy/Render
    plan: starter
    healthCheckPath: /
    disk:
      name: aldenfall-saves
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 10000
      - key: ALDENFALL_ENV
        value: render-test
